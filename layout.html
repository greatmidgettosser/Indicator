<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../../themes/default/css/colors.css" />
    <link rel="stylesheet" href="../../../themes/default/css/core.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .note-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .note-section {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .trade-note-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            margin-bottom: 2px;
            padding-bottom: 2px;
            border-bottom: 1px solid #333;
            min-height: 83px;
            max-height: 122px;
        }

        .trade-note-header {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 6px;
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow: hidden;
        }

        #screenshotStrip {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
            flex-shrink: 0;
        }

            #screenshotStrip.visible {
                display: inline-flex;
            }

        /* tradeNoteLabel is the flex row — it holds all pieces inline */
        #tradeNoteLabel {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 5px;
            overflow: hidden;
        }

        .trade-note-prefix {
            color: #aaa;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .trade-note-title {
            color: #00c864;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
            margin-right: 4px;
        }

        .ss-group-label {
            color: #aaa;
            font-size: 11px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ss-group-sep {
            flex-shrink: 0;
            width: 8px;
        }

        .ss-thumb-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 2px;
            padding: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
            text-decoration: none;
            color: inherit;
        }

            .ss-thumb-btn:hover {
                border-color: #00c864;
                background: #1a2a1a;
            }

            .ss-thumb-btn img {
                display: block;
                width: 12px;
                height: 12px;
                object-fit: cover;
                border-radius: 1px;
            }

        #tradeNoteArea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 8px;
            outline: none;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            cursor: text;
        }

            #tradeNoteArea:empty::before {
                content: attr(data-placeholder);
                color: #555;
                pointer-events: none;
            }

            #tradeNoteArea:focus {
                border-color: #555;
            }

        .trade-note-save-indicator {
            font-size: 10px;
            color: #555;
            text-align: right;
            margin-top: 1px;
            height: 4px;
        }

            .trade-note-save-indicator.saved {
                color: #00c864;
            }

        .note-header {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        #selectedDateLabel {
            color: #00c864;
        }

        #noteArea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            padding: 10px;
            outline: none;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            cursor: text;
        }

            #noteArea:empty::before {
                content: attr(data-placeholder);
                color: #555;
                pointer-events: none;
            }

            #noteArea:focus {
                border-color: #555;
            }

        .save-indicator {
            font-size: 10px;
            color: #555;
            text-align: right;
            margin-top: 4px;
            height: 14px;
        }

            .save-indicator.saved {
                color: #00c864;
            }

        .daily-verse {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-left: 10px;
            line-height: 1.4;
        }

        .daily-verse-ref {
            font-size: 11px;
            color: #ccaa00;
            font-style: normal;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="note-panel">
        <div class="trade-note-section">
            <div class="trade-note-header">
                <span id="tradeNoteLabel"><span class="trade-note-prefix">Trade Note</span></span>
                <span id="screenshotStrip"></span>
            </div>
            <div id="tradeNoteArea" contenteditable="true" data-placeholder="Click a trade to attach a note..."></div>
            <div class="trade-note-save-indicator" id="tradeNoteSaveIndicator"></div>
        </div>
        <div class="note-section">
            <div class="note-header">
                <span id="selectedDateLabel">Select a day to begin</span><span class="daily-verse" id="dailyVerseText"></span>
            </div>
            <div id="noteArea" contenteditable="true" data-placeholder="Write your daily notes here..."></div>
            <div class="save-indicator" id="saveIndicator"></div>
        </div>
    </div>
</body>
</html>
